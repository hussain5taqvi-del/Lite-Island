name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: "Also build the full release folder (engines, Filee) and upload it"
        type: boolean
        default: false

jobs:
  compile:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LiteIsland
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (compile check)
        shell: pwsh
        run: |
          dotnet build LiteIsland.csproj -c Release -nologo 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # show every error as one annotation (readable without opening the log)
            $errs = Select-String -Path build.log -Pattern ': error ' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Select-Object -First 60
            $msg = ($errs -join "%0A")
            Write-Host "::error title=Compile errors::$msg"
          }
          exit $code

  package:
    if: github.event_name == 'workflow_dispatch' && inputs.package
    needs: compile
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LiteIsland
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: dotnet publish LiteIsland.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o release
      - name: Engines (yt-dlp, deno, ffmpeg, Filee) into a staging folder
        shell: pwsh
        run: ./tools/get-engines.ps1 -Release "$PWD/stage"

      - name: Pack the tools into LiteIsland.exe (one file) and test it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force slim | Out-Null
          Copy-Item release/LiteIsland.exe slim/LiteIsland.exe          # without tools: this one is for auto-updates
          7z a -tzip -mx=5 engines.zip "./stage/*" | Out-Null
          $exe = (Resolve-Path release/LiteIsland.exe).Path
          $fs = [IO.File]::Open($exe, [IO.FileMode]::Append, [IO.FileAccess]::Write)
          $off = $fs.Length
          $in = [IO.File]::OpenRead((Resolve-Path engines.zip).Path)
          $len = $in.Length
          $in.CopyTo($fs, 4MB); $in.Close()
          $footer = [byte[]]([BitConverter]::GetBytes([int64]$off) + [BitConverter]::GetBytes([int64]$len) + [Text.Encoding]::ASCII.GetBytes('LIENGv01'))
          $fs.Write($footer, 0, 24); $fs.Close()
          Write-Host ("LiteIsland.exe = " + [math]::Round((Get-Item $exe).Length/1MB,1) + " MB (tools inside: " + [math]::Round($len/1MB,1) + " MB)")
          $p = Start-Process $exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed, exit code $($p.ExitCode)" }
          Write-Host "selftest ok: tools unpacked from the exe"

      - name: Smoke test (Filee CLI + yt-dlp)
        shell: pwsh
        run: |
          $out = @()
          $out += "ls: " + ((Get-ChildItem release -Name) -join ', ')
          $out += "filee: " + ((Get-ChildItem stage/filee -Name | Select-Object -First 25) -join ', ')
          $out += "engines: " + ((Get-ChildItem stage/filee/engines -Name -ErrorAction SilentlyContinue) -join ', ')
          $f = "stage/filee/filee-cli.exe"
          $out += "--- formats jpg"
          $out += (& $f formats jpg 2>&1 | Out-String)
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 40,40
          $bmp.Save("$PWD/t.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $out += "--- convert png->webp"
          $out += (& $f convert "$PWD/t.png" --to webp --json 2>&1 | Out-String)
          $out += "exit " + $LASTEXITCODE
          $out += "--- yt-dlp"
          $out += (& stage/engines/yt-dlp.exe --version 2>&1 | Out-String)
          $out += (& stage/engines/deno.exe --version 2>&1 | Out-String)
          Write-Host ("::notice title=Smoke::" + (($out -join "`n") -replace "`r","" -replace "%","%25" -replace "`n","%0A"))
      - uses: actions/upload-artifact@v4
        with:
          name: LiteIsland-release
          path: LiteIsland/release/LiteIsland.exe
